name: Build second research paper PDF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-second-paper.yml"
      - "scripts/build_second_paper.py"
      - "papers/second_paper/second_research_paper.tex"
      - "papers/second_paper/second_paper_references.bib"
      - "papers/second_paper/second_research_paper.bbl"
      - "papers/second_paper/figure_data_v1_4.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX and plotting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-publishers texlive-bibtex-extra texlive-fonts-recommended
          python -m pip install --upgrade pip
          python -m pip install matplotlib

      - name: Regenerate the three paper figures
        run: python scripts/build_second_paper.py

      - name: Compile the manuscript with the verified bibliography
        working-directory: papers/second_paper
        run: |
          test -s second_research_paper.bbl
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error second_research_paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error second_research_paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error second_research_paper.tex
          test -s second_research_paper.pdf
          if grep -E "Citation .* undefined|There were undefined citations|Reference .* undefined|There were undefined references" second_research_paper.log; then
            echo "Unresolved citations or references remain in the final LaTeX pass."
            exit 1
          fi
          pdfinfo second_research_paper.pdf | grep -E "Pages:|Page size:"

      - name: Commit compiled paper and regenerated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/second_paper/second_research_paper.pdf papers/second_paper/figures/*.png
          if git diff --cached --quiet; then
            echo "Paper PDF and figures are already up to date."
          else
            git commit -m "Build compiled second research paper and figures"
            git push
          fi
